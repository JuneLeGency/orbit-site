name: Deploy Orbit to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html index.en.html evidence.html evidence.en.html compatibility.html compatibility.en.html .nojekyll _site/
          cp -R data _site/data
          cp -R assets _site/assets
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // Use the successful upload receipt directly: artifact listing returned
            // zero entries twice even though REST confirmed the uploaded artifact.
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId || '')) throw new Error('Missing upload receipt');
            const oidcToken = await core.getIDToken();
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: Number(artifactId),
              pages_build_version: context.sha, oidc_token: oidcToken
            });
            core.setOutput('page_url', deployment.page_url);
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo, deployment_id: deployment.id
              });
              core.info(`Pages status: ${data.status}`);
              if (data.status === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                throw new Error(`Pages deployment failed: ${data.status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Pages deployment timed out');
